 const msg=(t,bad)=>{const m=document.getElementById("amsg");if(m){m.textContent=t;m.style.color=bad?"#b3261e":"#1a7f45"}};
 const val=(o,k)=>LN.includes(k)?(o[k]||[]).join("\n"):k==="pr"?(o.pr||[]).map(a=>a.join(" | ")).join("\n"):o[k];
 const FL={services:[["n","Name"],["s","URL slug"],["head","Page headline"],["d","Short description","t"],["i","Overview","t"],["ch","Challenges addressed (one per line)","t"],["inc","Inclusions (one per line)","t"],["cl","Client types (one per line)","t"],["pr","Process steps (title | text, one per line)","t"],["msg","WhatsApp message"]],
  industries:[["n","Name"],["d","Description","t"],["v","Related service slugs (comma separated)"]],directors:[["n","Name"],["role","Designation"],["bio","Biography","t"],["q","Qualifications / specialisations"],["f","Portrait","img"]],insights:[["n","Title"],["cat","Category"],["date","Publication date (genuine only)"],["d","Excerpt","t"]]};
 const blank={services:()=>({s:"new-service-"+(Date.now()%10000),n:"New service",head:"",d:"",i:"",ch:[],inc:[],cl:[],pr:[],msg:"Hello Finhrix, I would like to enquire about this service."}),industries:()=>({n:"New industry",d:"",v:""}),directors:()=>({n:"Name",role:"Director & Business Consultant",bio:"",q:"",f:""}),insights:()=>({n:"New article",cat:"Business Finance",date:"",d:""})};
 const inp=(c,k,l,v,ty="text")=>`<div class="af"><label>${l}</label><input type="${ty}" data-c="${c}" data-k="${k}" value="${esc(v)}" autocomplete="off"></div>`;
 const field=(c,i,o,[k,l,t])=>t==="img"?`<div class="af"><label>${l}</label><input type="text" data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(o[k])}" placeholder="Image URL or file name">${/^https?:/.test(o[k]||"")?`<img src="${esc(o[k])}" alt="" style="max-height:70px;margin-top:6px">`:""}<label class="btn o sm" style="margin-top:6px;display:inline-flex;text-transform:none;letter-spacing:0">Upload to Cloudinary<input type="file" accept="image/*" hidden data-up data-c="${c}" data-i="${i}" data-k="${k}"></label></div>`
  :`<div class="af"><label>${l}</label>${t?`<textarea rows="3" data-c="${c}" data-i="${i}" data-k="${k}">${esc(val(o,k))}</textarea>`:`<input type="text" data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(val(o,k))}">`}</div>`;
 function set(c,i,k,v){if(c==="int"){int[k]=v;localStorage.setItem("fh_int",JSON.stringify(int));return}
  if(c==="config"){CONFIG[k]=v;renderLogo();footer()}else{const o=COLL[c]()[+i];if(LN.includes(k))o[k]=v.split("\n").map(x=>x.trim()).filter(Boolean);else if(k==="pr")o.pr=v.split("\n").filter(x=>x.trim()).map(x=>{const[a,...b]=x.split("|");return[a.trim(),b.join("|").trim()]});else o[k]=v}draftSave()}
 function draw(){const TB=[["services","Services"],["industries","Industries"],["directors","Directors"],["insights","Insights"],["settings","Settings"],["publish","Publish"]];
  let h=`<div class="atabs">${TB.map(([t,l])=>`<button class="btn sm ${t===tab?"":"o"}" data-act="tab" data-t="${t}">${l}</button>`).join("")}</div><p id="amsg" role="status"></p>`;
  if(COLL[tab])h+=COLL[tab]().map((o,i)=>`<details class="ad"><summary>${esc(o.n||"Untitled")}</summary><div class="b">${FL[tab].map(f=>field(tab,i,o,f)).join("")}<div class="row"><button class="btn o sm" data-act="up" data-c="${tab}" data-i="${i}">Move up</button><button class="btn o sm" data-act="down" data-c="${tab}" data-i="${i}">Move down</button><button class="btn sm" style="background:#b3261e;border-color:#b3261e" data-act="del" data-c="${tab}" data-i="${i}">Remove</button></div></div></details>`).join("")+`<button class="btn" data-act="add" data-c="${tab}">Add ${tab==="industries"?"industry":tab.slice(0,-1)}</button>`;
  else if(tab==="settings")h+=`<h2>Contact &amp; WhatsApp</h2><div class="ag">${[["name","Company name"],["wa","WhatsApp number (digits with country code, e.g. 919876543210)"],["email","Email"],["phone","Phone"],["address","Office address"],["hours","Business hours"]].map(([k,l])=>inp("config",k,l,CONFIG[k])).join("")}</div><h2>Images</h2><div class="ag">${[["logo","Logo"],["favicon","Favicon"]].map(([k,l])=>field("config","",CONFIG,[k,l,"img"])).join("")}</div>
   <h2>Cloudinary</h2><div class="ag">${inp("int","cloud","Cloud name",int.cloud)}${inp("int","preset","Unsigned upload preset",int.preset)}</div><h2>GitHub</h2><div class="ag">${inp("int","owner","Owner",int.owner)}${inp("int","repo","Repository",int.repo)}${inp("int","branch","Branch (default main)",int.branch)}${inp("int","path","Content path (default content.json)",int.path)}${inp("int","token","Access token",int.token,"password")}</div><p class="note">These settings, including the token, stay in this browser only. Use a fine-grained token limited to this repository (Contents: read and write).</p>`;
  else h+=`<h2>Publish</h2><p>Edits save as a draft in this browser. Publishing commits <code>${esc(int.path||"content.json")}</code> to GitHub; the live site reads it for all visitors after your host redeploys.</p><div class="row"><button class="btn wa" data-act="pub">Publish to GitHub</button><button class="btn o" data-act="export">Download content.json</button><button class="btn o" data-act="reset">Discard draft</button></div>`;
  root.innerHTML=h}
 async function upload(f){if(!int.cloud||!int.preset)throw Error("Add the Cloudinary cloud name and upload preset in Settings.");const fd=new FormData();fd.append("file",f);fd.append("upload_preset",int.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${int.cloud}/image/upload`,{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error?.message||"Upload failed");return j.secure_url.replace("/upload/","/upload/f_auto,q_auto,w_1200/")}
 async function publish(){const br=int.branch||"main",path=int.path||"content.json";if(!int.owner||!int.repo||!int.token)return msg("Add the GitHub owner, repository and token in Settings.",1);
  const api=`https://api.github.com/repos/${int.owner}/${int.repo}/contents/${path}`,h={Authorization:"Bearer "+int.token,Accept:"application/vnd.github+json"};
  try{msg("Publishing...");let sha;const g=await fetch(`${api}?ref=${encodeURIComponent(br)}`,{headers:h});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error("GitHub error "+g.status+" reading the file. Check owner, repository and token.");
   const p=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"Update site content via admin",branch:br,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(snapshot(),null,2))))})});if(!p.ok)throw Error("GitHub: "+((await p.json()).message||p.status));msg("Published. The live site updates once your host redeploys.")}catch(e){msg(e.message,1)}}
 root.oninput=e=>{const t=e.target;if(t.dataset.k!==undefined&&t.type!=="file")set(t.dataset.c,t.dataset.i,t.dataset.k,t.value)};
 root.onchange=async e=>{const t=e.target;if(!t.matches("[data-up]")||!t.files[0])return;msg("Uploading...");try{const u=await upload(t.files[0]);set(t.dataset.c,t.dataset.i,t.dataset.k,u);draw();msg("Image uploaded.")}catch(er){msg(er.message,1)}};
 root.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=b.dataset.c,i=+b.dataset.i;
  if(a==="tab"){tab=b.dataset.t;sessionStorage.setItem("fh_tab",tab);return draw()}
  if(a==="add"){COLL[c]().push(blank[c]());draftSave();return draw()}
  if(a==="del"){if(confirm("Remove this entry?")){COLL[c]().splice(i,1);draftSave();draw()}return}
  if(a==="up"||a==="down"){const r=COLL[c](),j=a==="up"?i-1:i+1;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]];draftSave();return draw()}
  if(a==="pub")return publish();
  if(a==="export"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}));l.download="content.json";l.click();return}
  if(a==="reset"&&confirm("Discard your draft and reload published content?")){localStorage.removeItem("fh_draft");location.reload()}};
 draw()}
/* ===== 11. INIT ===== */
(async()=>{try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok)applyData(await r.json())}catch(e){}
 try{const d=localStorage.getItem("fh_draft");if(d)applyData(JSON.parse(d))}catch(e){}
 renderLogo();footer();route()})();
</script></body></html>
